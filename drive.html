<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111e26">
  <meta name="description" content="Drive through a city and explore my work, education and projects on overhead signs.">
  <link rel="icon" href="./art/mark.svg" type="image/svg+xml">
  <title>Night Shift — Marin Grabovac</title>
  <script type="module" crossorigin src="./site-assets/drive-B5Wlbt9H.js"></script>
  <link rel="modulepreload" crossorigin href="./site-assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="./site-assets/three-BN0XoQ5I.js">
  <link rel="modulepreload" crossorigin href="./site-assets/story-Dg-WGQ3T.js">
  <link rel="stylesheet" crossorigin href="./site-assets/drive-D_P_jBg0.css">
</head>
<body>
  <main id="game" aria-labelledby="drive-title">
    <div id="view" aria-hidden="true"></div>
    <header class="top">
      <a class="back button" href="./">
        <span class="back-label"><span aria-hidden="true">↖</span><span data-copy="back">Portfolio</span></span>
        <span class="breadcrumb" aria-hidden="true"><span class="breadcrumb-separator">›</span><span id="station-name">—</span><span class="station-meta" id="chapter-index">—</span></span>
      </a>
      <div class="current-route" role="group" aria-label="CV in the city">
        <h1 class="sr-only" id="drive-title" data-copy="title">Night Shift</h1>
        <button type="button" class="current-section" id="read-story" aria-haspopup="dialog" aria-controls="story-reader" disabled><span id="chapter">—</span></button>
      </div>
      <div class="actions">
        <button type="button" id="reset" data-copy="reset" disabled>Reset</button>
        <button type="button" id="heal" data-copy="heal" disabled>Restore text</button>
      </div>
    </header>
    <dialog id="story-reader" aria-labelledby="entry-title">
      <form method="dialog"><button data-copy="close">Close</button></form>
      <article id="story-entry"></article>
    </dialog>
    <p id="notice" role="status" aria-live="polite"></p>
    <div class="bottom">
      <details class="controls">
        <summary data-copy="controls">Controls</summary>
        <div class="key-guide">
          <p><kbd>W A S D</kbd> <kbd>↑ ← ↓ →</kbd> <span data-copy="move">Drive and steer</span></p>
          <p><kbd>Space</kbd> <span data-copy="brake">Brake</span> <kbd>R</kbd> <span data-copy="reset">Reset</span></p>
          <p><kbd>H</kbd> <span data-copy="heal">Restore text</span></p>
        </div>
      </details>
      <div class="speed" role="group" aria-label="Speed"><b id="speed">000</b><span>KM/H</span></div>
    </div>
    <div class="touch" hidden>
      <div>
        <button type="button" data-input="left" aria-label="Steer left">◀</button>
        <button type="button" data-input="right" aria-label="Steer right">▶</button>
      </div>
      <div>
        <button type="button" data-input="brake" aria-label="Brake">■</button>
        <button type="button" data-input="reverse" aria-label="Reverse">▼</button>
        <button type="button" data-input="forward" aria-label="Accelerate">▲</button>
      </div>
    </div>
    <div class="cover" id="cover">
      <div class="cover-inner"><span>MG / INTERACTIVE 02</span><strong data-copy="title">Night Shift</strong><p id="cover-text" role="status" data-copy="loading" data-unavailable="Could not load the city stories. Return to the portfolio or reload the page." data-unavailable-hr="Sadržaj vožnje nije dostupan. Vrati se na portfolio ili ponovno učitaj stranicu.">Preparing the city…</p><button id="start" type="button" hidden data-copy="start">Start driving</button><a class="button error-back" href="./" hidden data-copy="back">Portfolio</a></div>
    </div>
    <noscript><p class="noscript">Enable JavaScript to drive. <a href="./">Back to the portfolio</a></p></noscript>
  </main>
</body>
</html>
